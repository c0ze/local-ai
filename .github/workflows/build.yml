name: Build check

# The app is deployed by hand to a Cloudflare Worker (npm run deploy, see
# scripts/deploy_cloudflare.sh). This only checks that it still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Run JavaScript actions on Node 24 (opt in ahead of GitHub's June 2026 default).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node (via kokoro-js, Node side only) downloads CUDA binaries on
  # Linux x64 at install time; that release asset is gone (404).
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
